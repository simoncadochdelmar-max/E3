
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Mes devis — Entreprise 3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root{font-family:Arial,sans-serif;color:#202b3c;background:#f5f2ec;--navy:#102541;--gold:#c9963a;--line:#dedbd4;--muted:#657186}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:820px;margin:auto}.brand{color:white;background:var(--navy);padding:20px 24px;border-radius:16px 16px 0 0}.brand strong{font-size:20px;letter-spacing:.02em}.body{background:white;padding:24px;border-radius:0 0 16px 16px;box-shadow:0 10px 28px #10254112}
    h1{font-size:25px;margin:0 0 7px;color:var(--navy)}.sub{color:var(--muted);line-height:1.5;margin:0}.status{padding:12px 14px;background:#fbeecb;border-radius:10px;margin:18px 0}.status.error{background:#fdf0ef;color:#9d241e}
    .offer{border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0;background:#fff}.quote-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:15px}.quote-label{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}.offer h2{font-size:22px;color:var(--navy);margin:5px 0}.quote-number,.quote-date{font-size:13px;color:var(--muted);margin:4px 0}.company-grid,.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.info-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfbf9;min-width:0}.info-box small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}.info-box strong,.info-box span{overflow-wrap:anywhere}.info-box a{color:var(--navy)}
    .section-title{font-size:15px;color:var(--navy);margin:20px 0 9px}.scope-list{display:grid;gap:9px}.scope-box{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;break-inside:avoid}.scope-box h3{font-size:15px;margin:0 0 6px;color:var(--navy)}.scope-box p{margin:0;white-space:pre-wrap;line-height:1.5}.scope-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}.details{white-space:pre-wrap;line-height:1.5;margin:0}.price-box{display:flex;justify-content:space-between;gap:16px;align-items:center;background:#f4f6f8;border-radius:12px;padding:16px;margin:18px 0}.price-box small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.amount{font-size:27px;font-weight:800;color:var(--navy);margin-top:4px}.validity{font-size:13px;color:var(--muted);text-align:right}.contact{margin:14px 0 0;padding:13px;background:#eaf6f0;border-radius:10px;line-height:1.55}.contact p{margin:3px 0}.status-tag{font-size:12px;font-weight:700;color:#28543b;background:#eaf6f0;border-radius:99px;padding:7px 10px;white-space:nowrap}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{width:100%;border:0;border-radius:10px;background:var(--navy);color:white;padding:13px;font-size:15px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn:disabled{opacity:.6;cursor:wait}.empty{padding:14px;background:#f5f3ef;border-radius:10px}.fineprint{font-size:12px;color:var(--muted);margin-top:18px}
    @media(max-width:560px){body{padding:12px 8px}.body{padding:18px 14px}.offer{padding:16px}.quote-head{display:block}.status-tag{display:inline-block;margin-top:8px}.company-grid,.project-grid{grid-template-columns:1fr 1fr}.price-box{align-items:flex-start;flex-direction:column}.validity{text-align:left}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><strong>ENTREPRISE 3 · COMPARAISON DES DEVIS</strong></header>
    <section class="body">
      <h1>Vos propositions de devis</h1>
      <p class="sub">Comparez le prix, les prestations comprises et les coordonnées de chaque entreprise.</p>
      <div id="status" class="status">Chargement de vos devis…</div>
      <div id="offers"></div>
      <p class="fineprint">Chaque devis est proposé par l’entreprise indiquée. Vérifiez avec elle les modalités avant de confirmer votre choix.</p>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://yqjeqcomrubelahrvizd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hKaiVb_fWBPRgESxpwWNCA_iAN9acMe';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const params = new URLSearchParams(location.search);
    const reference = params.get('reference');
    const token = params.get('token');
    const statusBox = document.getElementById('status');
    const offersBox = document.getElementById('offers');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = value => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(value));
    const priceUnits = {forfait:'Forfait',par_intervention:'Par intervention',mensuel:'Par mois',annuel:'Par an'};
    const prettyDate = value => value ? new Intl.DateTimeFormat('fr-FR',{dateStyle:'long'}).format(new Date(`${value.slice(0,10)}T00:00:00`)) : '';

    function parseQuoteDetails(raw) {
      if (typeof raw !== 'string') return null;
      try {
        const value = JSON.parse(raw);
        return value && ['e3_quote_v1','e3_quote_v2'].includes(value.format) ? value : null;
      } catch { return null; }
    }

    function renderOffer(o, data, index) {
      const snapshot = parseQuoteDetails(o.details);
      const entreprise = snapshot?.entreprise || o.entreprise || 'Entreprise non renseignée';
      const siret = snapshot?.siret || o.siret || '';
      const telephone = snapshot?.telephone || o.telephone || '';
      const email = snapshot?.email || o.email || '';
      const prestations = snapshot?.prestations || [];
      const legacyDetails = snapshot ? '' : String(o.details || '');
      const validite = prettyDate(o.validite_jusquau);
      const dateEmission = prettyDate(o.created_at);
      const statut = o.statut === 'choisi' ? 'Entreprise retenue' : o.statut === 'non_retenu' ? 'Non retenue' : 'Proposition reçue';
      return `
        <article class="offer" data-offer="${esc(o.id)}">
          <div class="quote-head">
            <div><div class="quote-label">Devis</div><h2>${esc(entreprise)}</h2>
              <p class="quote-number">Référence demande ${esc(data.reference)} · Proposition n° ${index + 1}</p>
              ${dateEmission ? `<p class="quote-date">Émis le ${esc(dateEmission)}</p>` : ''}</div>
            <span class="status-tag">${esc(statut)}</span>
          </div>
          <h3 class="section-title">Entreprise</h3>
          <div class="company-grid">
            <div class="info-box"><small>Nom de l’entreprise</small><strong>${esc(entreprise)}</strong></div>
            <div class="info-box"><small>SIRET</small><strong>${esc(siret || 'Non renseigné')}</strong></div>
            <div class="info-box"><small>Téléphone</small>${telephone ? `<strong><a href="tel:${esc(telephone)}">${esc(telephone)}</a></strong>` : '<span>Non renseigné</span>'}</div>
            <div class="info-box"><small>E-mail</small>${email ? `<strong><a href="mailto:${esc(email)}">${esc(email)}</a></strong>` : '<span>Non renseigné</span>'}</div>
          </div>
          <h3 class="section-title">Demande concernée</h3>
          <div class="project-grid">
            <div class="info-box"><small>Référence</small><strong>${esc(data.reference || '—')}</strong></div>
            <div class="info-box"><small>Lieu</small><strong>${esc(data.ville || '—')}</strong></div>
          </div>
          <h3 class="section-title">Prestations et travaux compris</h3>
          ${prestations.length ? `<div class="scope-list">${prestations.map(item => `<section class="scope-box"><h3>${esc(item.nom || 'Prestation')}</h3><p>${esc(item.details || 'Détail non précisé')}</p>${item.quantite != null || item.prix_unitaire != null ? `<div class="scope-meta"><span>${esc(item.quantite ?? 1)} ${esc(item.unite || 'unité')} × ${money(item.prix_unitaire || 0)} TTC</span><strong>${money(item.total ?? (Number(item.quantite || 1) * Number(item.prix_unitaire || 0)))}</strong></div>` : ''}</section>`).join('')}</div>` : `<div class="scope-box"><p class="details">${esc(legacyDetails || 'Détail des prestations non renseigné.')}</p></div>`}
          ${snapshot?.notes ? `<h3 class="section-title">Délais et conditions</h3><div class="scope-box"><p class="details">${esc(snapshot.notes)}</p></div>` : ''}
          ${o.frequence ? `<div class="info-box" style="margin-top:12px"><small>Fréquence / durée</small><strong>${esc(o.frequence)}</strong></div>` : ''}
          <div class="price-box"><div><small>Prix proposé · ${esc(priceUnits[o.unite_tarifaire] || '')} · TTC</small><div class="amount">${money(o.montant)}</div></div>
            <div class="validity">${validite ? `Valable jusqu’au<br><strong>${esc(validite)}</strong>` : 'Date de validité non précisée'}</div></div>
          <div class="contact"><strong>Contacter l’entreprise</strong>
            ${telephone ? `<p>Téléphone : <a href="tel:${esc(telephone)}">${esc(telephone)}</a></p>` : ''}
            ${email ? `<p>E-mail : <a href="mailto:${esc(email)}">${esc(email)}</a></p>` : ''}
          </div>
          <div class="actions">
            <button class="btn secondary" data-download="${esc(o.id)}">Télécharger le devis en PDF</button>
            ${data.statut === 'nouveau' ? `<button class="btn" data-quote="${esc(o.id)}">Choisir cette entreprise</button>` : ''}
          </div>
        </article>`;
    }

    async function loadOffers() {
      if (!reference || !token) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Ce lien de suivi est incomplet. Ouvrez le lien privé reçu après l’envoi de votre demande.';
        return;
      }
      const { data, error } = await sb.rpc('lire_devis_demande', { p_reference: reference, p_token: token });
      if (error) {
        console.error('Erreur lire_devis_demande:', error);
        statusBox.className = 'status error';
        statusBox.textContent = `Erreur Supabase (${error.code || 'sans code'}) : ${error.message || 'détail indisponible'}${error.details ? ` — ${error.details}` : ''}${error.hint ? ` — Conseil : ${error.hint}` : ''}`;
        return;
      }
      if (!data) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Aucune demande ne correspond à ce lien privé.';
        return;
      }
      statusBox.className = 'status';
      statusBox.textContent = `Demande ${data.reference} · ${data.ville || ''} · ${data.statut === 'assigne' ? 'Entreprise choisie' : 'En attente de votre choix'}`;
      const offers = data.devis || [];
      if (!offers.length) {
        offersBox.innerHTML = '<p class="empty">Aucun devis reçu pour le moment. Revenez plus tard avec ce lien privé.</p>';
        return;
      }
      window.currentOffers = offers;
      window.currentRequest = data;
      offersBox.innerHTML = offers.map((o, index) => renderOffer(o, data, index)).join('');
      offersBox.querySelectorAll('[data-quote]').forEach(button => button.addEventListener('click', () => choose(button)));
      offersBox.querySelectorAll('[data-download]').forEach(button => button.addEventListener('click', () => downloadOffer(button.dataset.download)));
    }

    function downloadOffer(id) {
      const offer = (window.currentOffers || []).find(item => String(item.id) === String(id));
      if (!offer) return;
      if (!window.jspdf?.jsPDF) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Le PDF ne peut pas être créé. Vérifiez votre connexion Internet puis actualisez la page.';
        return;
      }
      const data = window.currentRequest || {};
      const snapshot = parseQuoteDetails(offer.details);
      const pdf = new window.jspdf.jsPDF({unit:'mm',format:'a4'});
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 16;
      const contentWidth = pageWidth - margin * 2;
      let y = 18;
      const ensureRoom = height => { if (y + height > pageHeight - margin) { pdf.addPage(); y = margin; } };
      const addText = (value, x = margin, width = contentWidth, fontSize = 10, style = 'normal', color = [32,43,60]) => {
        pdf.setFont('helvetica', style); pdf.setFontSize(fontSize); pdf.setTextColor(...color);
        const lines = pdf.splitTextToSize(String(value || ''), width);
        ensureRoom(lines.length * (fontSize * .45) + 2);
        pdf.text(lines, x, y); y += lines.length * (fontSize * .45) + 2;
      };
      const rule = () => { pdf.setDrawColor(222,219,212); pdf.line(margin,y,pageWidth-margin,y); y += 6; };
      const entreprise = snapshot?.entreprise || offer.entreprise || 'Entreprise non renseignée';
      const siret = snapshot?.siret || offer.siret || 'Non renseigné';
      const telephone = snapshot?.telephone || offer.telephone || 'Non renseigné';
      const email = snapshot?.email || offer.email || '';
      const prestations = snapshot?.prestations || [];
      pdf.setFillColor(16,37,65); pdf.rect(0,0,pageWidth,36,'F');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(255,255,255); pdf.text('ENTREPRISE 3',margin,14);
      pdf.setFontSize(22); pdf.text('DEVIS',margin,27);
      pdf.setFontSize(10); pdf.text(`Demande ${data.reference || ''}`,pageWidth-margin,27,{align:'right'});
      y = 47;
      addText(entreprise,margin,contentWidth,16,'bold',[16,37,65]);
      addText(`SIRET : ${siret}`);
      addText(`Téléphone : ${telephone}`);
      if (email) addText(`E-mail : ${email}`);
      y += 2; rule();
      addText('DEMANDE CONCERNÉE',margin,contentWidth,10,'bold',[16,37,65]);
      addText(`Référence : ${data.reference || '—'}    Ville : ${data.ville || '—'}`);
      if (offer.created_at) addText(`Date du devis : ${prettyDate(offer.created_at)}`);
      if (offer.validite_jusquau) addText(`Valable jusqu’au : ${prettyDate(offer.validite_jusquau)}`);
      y += 2; rule();
      addText('DÉTAIL DES PRESTATIONS',margin,contentWidth,10,'bold',[16,37,65]);
      if (prestations.length) {
        prestations.forEach(item => {
          ensureRoom(22);
          addText(item.nom || 'Prestation',margin,contentWidth,11,'bold',[16,37,65]);
          addText(item.details || 'Détail non précisé',margin+2,contentWidth-2,9);
          if (item.quantite != null || item.prix_unitaire != null) {
            const lineTotal = item.total ?? Number(item.quantite || 1) * Number(item.prix_unitaire || 0);
            addText(`${item.quantite ?? 1} ${item.unite || 'unité'} × ${money(item.prix_unitaire || 0)} TTC = ${money(lineTotal)}`,margin+2,contentWidth-2,9,'bold');
          }
          y += 2;
        });
      } else addText(offer.details || 'Détail non renseigné');
      if (snapshot?.notes) { y += 2; addText('DÉLAIS ET CONDITIONS',margin,contentWidth,10,'bold',[16,37,65]); addText(snapshot.notes); }
      y += 4; ensureRoom(28); pdf.setFillColor(244,246,248); pdf.roundedRect(margin,y,contentWidth,22,2,2,'F');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(32,43,60); pdf.text(`TOTAL TTC · ${priceUnits[offer.unite_tarifaire] || ''}`.trim(),margin+5,y+8);
      pdf.setFontSize(18); pdf.setTextColor(16,37,65); pdf.text(money(offer.montant),pageWidth-margin-5,y+16,{align:'right'}); y += 30;
      addText('Le prix et les modalités définitives sont à confirmer directement avec l’entreprise.',margin,contentWidth,8,'normal',[101,113,134]);
      const safeName = String(entreprise).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'') || 'entreprise';
      pdf.save(`devis-${data.reference || 'demande'}-${safeName}.pdf`);
    }

    async function choose(button) {
      if (!confirm('Confirmer le choix de cette entreprise ? Les autres devis seront marqués comme non retenus.')) return;
      button.disabled = true;
      button.textContent = 'Confirmation…';
      const { error } = await sb.rpc('choisir_devis_demande', {
        p_reference: reference,
        p_token: token,
        p_devis_id: button.dataset.quote
      });
      if (error) {
        statusBox.className = 'status error';
        statusBox.textContent = error.message || 'Impossible de confirmer ce choix. Actualisez la page et réessayez.';
        button.disabled = false;
        button.textContent = 'Choisir cette entreprise';
        return;
      }
      await loadOffers();
    }
    loadOffers();
  </script>
</body>
</html>

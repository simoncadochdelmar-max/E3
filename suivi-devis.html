<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Suivre mes devis — Entreprise 3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:Arial,sans-serif;color:#1a2332;background:#faf7f2;--navy:#0e2140;--gold:#c9963a;--line:#e0d8cc}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:680px;margin:auto}.brand{color:white;background:var(--navy);padding:22px;border-radius:18px 18px 0 0}.brand strong{font-size:20px}.body{background:white;padding:24px;border-radius:0 0 18px 18px;box-shadow:0 10px 28px #0e214012}
    h1{font-size:23px;margin:0 0 8px;color:var(--navy)}.sub{color:#667085;line-height:1.5}.status{padding:12px 14px;background:#fbeecb;border-radius:10px;margin:18px 0}.offer{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.offer h2{font-size:18px;margin:0 0 5px}.amount{font-size:24px;font-weight:800;color:var(--navy);margin:12px 0}.details{white-space:pre-wrap;line-height:1.5}.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--navy);color:white;padding:14px;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.contact{margin-top:14px;padding:12px;background:#eaf6f0;border-radius:10px}.empty,.error{padding:14px;background:#f5f3ef;border-radius:10px}.error{background:#fdf0ef;color:#9d241e}a{color:var(--navy)}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><strong>Entreprise 3</strong></header>
    <section class="body">
      <h1>Vos propositions de devis</h1>
      <p class="sub">Comparez les offres des entreprises et choisissez celle qui vous convient. Le prix et les prestations sont proposés par chaque artisan.</p>
      <div id="status" class="status">Chargement de vos devis…</div>
      <div id="offers"></div>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://yqjeqcomrubelahrvizd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hKaiVb_fWBPRgESxpwWNCA_iAN9acMe';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const params = new URLSearchParams(location.search);
    const reference = params.get('reference');
    const token = params.get('token');
    const statusBox = document.getElementById('status');
    const offersBox = document.getElementById('offers');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = value => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(value));
    const priceUnits = {forfait:'forfait',par_intervention:'par intervention',mensuel:'par mois',annuel:'par an'};

    async function loadOffers() {
      if (!reference || !token) {
        statusBox.className = 'error';
        statusBox.textContent = 'Ce lien de suivi est incomplet. Ouvrez le lien privé reçu après l’envoi de votre demande.';
        return;
      }
      const { data, error } = await sb.rpc('lire_devis_demande', { p_reference: reference, p_token: token });
      if (error) {
        console.error('Erreur lire_devis_demande:', error);
        statusBox.className = 'error';
        statusBox.textContent = `Erreur Supabase (${error.code || 'sans code'}) : ${error.message || 'détail indisponible'}${error.details ? ` — ${error.details}` : ''}${error.hint ? ` — Conseil : ${error.hint}` : ''}`;
        return;
      }
      if (!data) {
        statusBox.className = 'error';
        statusBox.textContent = 'Supabase a répondu, mais aucune demande ne correspond à ce lien. Vérifiez que ce lien correspond bien à cette demande.';
        return;
      }
      statusBox.textContent = `Demande ${data.reference} · ${data.ville} · ${data.statut === 'assigne' ? 'Entreprise choisie' : 'En attente de votre choix'}`;
      const offers = data.devis || [];
      if (!offers.length) {
        offersBox.innerHTML = '<p class="empty">Aucun devis reçu pour le moment. Revenez plus tard avec ce lien privé.</p>';
        return;
      }
      offersBox.innerHTML = offers.map(o => `
        <article class="offer">
          <h2>${esc(o.entreprise)}</h2>
          ${o.siret ? `<div>SIRET : ${esc(o.siret)}</div>` : ''}
          <div class="amount">${money(o.montant)} TTC ${esc(priceUnits[o.unite_tarifaire] || '')}</div>
          ${o.frequence ? `<p><strong>Fréquence / durée :</strong> ${esc(o.frequence)}</p>` : ''}
          ${o.validite_jusquau ? `<p><strong>Valable jusqu’au :</strong> ${esc(o.validite_jusquau)}</p>` : ''}
          <div class="details">${esc(o.details)}</div>
          ${o.statut === 'choisi' ? `<div class="contact"><strong>Entreprise retenue</strong>${o.telephone ? `<p>Téléphone : <a href="tel:${esc(o.telephone)}">${esc(o.telephone)}</a></p>` : ''}${o.email ? `<p>E-mail : <a href="mailto:${esc(o.email)}">${esc(o.email)}</a></p>` : ''}</div>` : ''}
          ${data.statut === 'nouveau' ? `<button class="btn" data-quote="${esc(o.id)}">Choisir cette entreprise</button>` : ''}
        </article>`).join('');
      offersBox.querySelectorAll('[data-quote]').forEach(button => button.addEventListener('click', () => choose(button)));
    }

    async function choose(button) {
      if (!confirm('Confirmer le choix de cette entreprise ? Les autres devis seront marqués comme non retenus.')) return;
      button.disabled = true;
      button.textContent = 'Confirmation…';
      const { error } = await sb.rpc('choisir_devis_demande', {
        p_reference: reference,
        p_token: token,
        p_devis_id: button.dataset.quote
      });
      if (error) {
        statusBox.className = 'error';
        statusBox.textContent = error.message || 'Impossible de confirmer ce choix. Actualisez la page et réessayez.';
        button.disabled = false;
        button.textContent = 'Choisir cette entreprise';
        return;
      }
      await loadOffers();
    }
    loadOffers();
  </script>
</body>
</html>
